plugins { id 'com.android.application' }
android {
    namespace 'dev.remember.app'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.remember.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'dev.remember.app.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
